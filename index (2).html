<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Name Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: navy masthead with the headline numbers, then a restrained white-on-grey body of ruled sections. Serif headings, brass accents. */
:root {
  --bg: #ffffff;
  --surface: #f6f8fb;
  --ink: #0f1d3a;
  --muted: #55627a;
  --line: #dde3ec;
  --navy: #0a1020;
  --accent: #2554b8;
  --accent-soft: #e6edfa;
  --signal: #6d5bd0;
  --violet: #1b7f88;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 112px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.65 var(--font-body); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.15; }
p { margin: 0; }
.wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 24px; }
.caps { text-transform: uppercase; letter-spacing: 0.14em; font-weight: 600; font-size: 0.72rem; }

/* Top banner with contact details */
.topbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 18px; padding-top: 9px; padding-bottom: 9px; }
.topbar .tb-name { font: 600 0.95rem var(--font-display); color: var(--ink); }
.topbar .tb-name::after { content: "\2014"; margin-left: 14px; color: var(--muted); font-weight: 400; }
.topbar a { color: var(--muted); text-decoration: none; font-size: 0.78rem; white-space: nowrap; }
.topbar a:hover { color: var(--accent); }
@media (max-width: 720px) { .topbar .tb-name::after { content: none; } .topbar .tb-name { flex-basis: 100%; } }
/* Nav */
.sticky-head { position: sticky; top: 0; z-index: 10; background: var(--bg); }
.nav { background: var(--bg); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; align-items: center; justify-content: flex-start; gap: 16px; height: 52px; }
.brand { font: 600 1.15rem var(--font-display); color: var(--ink); text-decoration: none; white-space: nowrap; letter-spacing: 0.01em; }
.nav ul { display: flex; gap: 18px; list-style: none; margin: 0; padding: 0; overflow-x: auto; }
.nav li a { display: block; padding: 6px 0; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 500; font-size: 0.72rem; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; }
.nav li a:hover { color: var(--ink); border-bottom-color: var(--accent); }

/* Masthead */
.hero-band { background: var(--bg); color: var(--ink); }
.hero { padding: 88px 0 0; }
.hero-band { border-bottom: 0; }
.eyebrow { text-transform: uppercase; letter-spacing: 0.16em; font-weight: 600; font-size: 0.75rem; color: var(--accent); }
.hero h1 { font-size: clamp(2.6rem, 6vw, 4.4rem); font-weight: 600; margin: 16px 0 20px; letter-spacing: -0.015em; color: var(--ink); }
.hero { position: relative; }
.portrait { position: absolute; right: 24px; top: 96px; width: 240px; height: 240px; object-fit: cover; border-radius: 50%; border: 6px solid var(--bg); box-shadow: 0 0 0 1px var(--line), 0 12px 32px rgba(15,29,58,0.12); }
@media (max-width: 1080px) { .portrait { position: static; display: block; width: 132px; height: 132px; margin: 0 0 24px; } }
.hero .lede { max-width: 58ch; font-size: 1.2rem; line-height: 1.6; color: var(--muted); }
.hero .focus { margin-top: 16px; padding-left: 0; text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.75rem; font-weight: 500; color: var(--muted); }
.hero .philosophy { margin-top: 28px; font: 500 italic 1.5rem/1.35 var(--font-display); color: var(--ink); max-width: 34ch; }
.pull { margin: 0 0 28px; padding: 32px; background: var(--surface); border-radius: 8px; }
.pull p { font: 600 clamp(1.5rem, 3vw, 2.1rem)/1.25 var(--font-display); }
.pull span { display: block; margin-top: 12px; color: var(--muted); max-width: 64ch; }
.hero .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
.btn { display: inline-block; padding: 12px 24px; border-radius: 2px; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; border: 1.5px solid var(--ink); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:hover { filter: brightness(1.08); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-top: 64px; border-top: 1px solid var(--line); padding-bottom: 24px; }
.stat { padding: 28px 24px 32px 0; }
.stat + .stat { padding-left: 24px; border-left: 0; }
.stat b { display: block; font: 600 2.6rem/1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--ink); }
.stat span { display: block; margin-top: 10px; font-size: 0.88rem; color: var(--muted); max-width: 22ch; }

/* Sections */
section.block { padding: 88px 0 24px; border-top: 0; }
section.block:first-child { border-top: 0; }
.label { text-transform: uppercase; letter-spacing: 0.16em; font-weight: 600; font-size: 0.72rem; color: var(--accent); }
.block h2 { font-size: clamp(1.8rem, 3.6vw, 2.5rem); margin: 10px 0 12px; letter-spacing: -0.01em; }
.intro { color: var(--muted); max-width: 62ch; margin: 12px 0 40px; font-size: 1.02rem; }
.grid { display: grid; gap: 20px; }
.cols-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.cols-3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.card { background: var(--surface); border: 0; border-radius: 8px; padding: 28px; min-width: 0; }
.card h3 { font-size: 1.2rem; margin-bottom: 10px; }
.card p { color: var(--muted); font-size: 0.96rem; }
.big { font: 600 2.4rem/1 var(--font-display); color: var(--accent); font-variant-numeric: tabular-nums; margin-bottom: 10px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
.tag { font-size: 0.72rem; font-weight: 500; letter-spacing: 0.04em; padding: 3px 10px; border-radius: 2px; background: var(--accent-soft); color: var(--accent); }
.meta { text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.7rem; font-weight: 500; color: var(--muted); margin-bottom: 8px; }

/* Problems solved */
.case { display: grid; grid-template-columns: 1fr; gap: 16px; align-content: start; }
.case .tags { align-self: start; margin-top: 4px; }
.case dl { margin: 0; display: grid; gap: 14px; }
.case dt { text-transform: uppercase; letter-spacing: 0.14em; font-weight: 600; font-size: 0.68rem; color: var(--accent); }
.case dd { margin: 3px 0 0; color: var(--muted); font-size: 0.95rem; }
.case dd.result { color: var(--ink); font-weight: 500; }

/* Reports */
.reports { display: grid; border: 0; border-radius: 8px; background: var(--surface); }
.report { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 2fr) minmax(0, 1fr); gap: 24px; padding: 22px 26px; border-top: 1px solid var(--line); align-items: start; }
.report:first-child { border-top: 0; }
.report h3 { font-size: 1.05rem; }
.report p { color: var(--muted); font-size: 0.94rem; }
.report .tags { margin-top: 0; }
.report .meta { margin: 6px 0 0; }

/* Leadership */
.lead-top { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 20px; margin-bottom: 20px; }

/* End-to-end timeline */
.tl-scroll { overflow-x: auto; padding-bottom: 8px; }
.tl { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) minmax(0, 1.6fr); align-items: start; min-width: 860px; }
.tl-step { position: relative; text-align: center; padding: 0 8px; }
.tl-step::before { content: ""; position: absolute; top: 21px; left: 50%; right: -50%; height: 2px; background: var(--line); }
.tl-step:nth-child(5)::before { right: 0; }
.tl-dot { position: relative; z-index: 1; display: grid; place-items: center; width: 44px; height: 44px; margin: 0 auto 12px; border-radius: 50%; background: var(--accent); color: #fff; box-shadow: 0 0 0 6px var(--bg); }
.tl-num { display: block; text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.65rem; font-weight: 600; color: var(--muted); margin-bottom: 2px; }
.tl-name { display: block; font: 600 0.95rem/1.25 var(--font-display); }
.tl-fork { display: grid; gap: 10px; border-left: 2px solid var(--line); padding-left: 28px; }
.tl-pill { position: relative; display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 6px 14px; border-radius: 8px; background: var(--accent-soft); font-size: 0.85rem; font-weight: 500; line-height: 1.3; }
.tl-pill svg { flex: none; color: var(--accent); }
.tl-pill::before { content: ""; position: absolute; left: -28px; top: 50%; width: 28px; height: 2px; background: var(--line); }
/* End-to-end flow */
.flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 20px; }
.step { position: relative; padding-top: 30px; border-top: 2px solid var(--line); min-width: 0; }
.step .num { position: absolute; top: -15px; left: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; font: 600 0.85rem/28px var(--font-body); text-align: center; }
.step h3 { font-size: 1.05rem; margin-bottom: 8px; }
.step p { color: var(--muted); font-size: 0.92rem; }
.flow-after { margin-top: 48px; }
.flow-after .label { margin-bottom: 16px; }
/* Skills hub */
.vt.h2 { font: 600 13px var(--font-body); fill: var(--ink); }
.vt.hubc { fill: #fff; }
/* Skills Venn */
.venn-layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 36px; align-items: center; }
.venn { width: 100%; height: auto; max-width: 560px; margin: 0 auto; display: block; }
.vc { cursor: pointer; outline: none; }
.vc circle { fill-opacity: 0.2; stroke-width: 2; transition: fill-opacity 0.2s; }
.vc.on circle, .vc:focus-visible circle { fill-opacity: 0.4; }
.vc:focus-visible circle { stroke-width: 4; }
.vt { font-family: var(--font-body); fill: var(--ink); text-anchor: middle; pointer-events: none; }
.vt.h { font-family: var(--font-display); font-weight: 600; font-size: 19px; }
.vt.s { font-size: 12px; fill: var(--muted); }
.vt.o { font-size: 12px; font-weight: 500; }
.vt.c { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.vcards { display: grid; gap: 14px; }
.vcard { border-left: 4px solid var(--c); padding: 20px 22px; transition: background 0.2s; }
.vcard.on { background: color-mix(in srgb, var(--c) 10%, var(--surface)); }
.vcard h3 { font-size: 1.1rem; margin-bottom: 4px; }
.vcard .tags { margin-top: 12px; }
.vcard .tag { background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: var(--ink); }
.venn-note { margin-top: 32px; padding: 24px 28px; border-radius: 8px; background: var(--surface); font-family: var(--font-display); font-size: 1.15rem; line-height: 1.5; }
.venn-note b { font-weight: 600; }
@media (max-width: 820px) { .venn-layout { grid-template-columns: 1fr; } }

.card .when { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 0.88rem; }
.card .when b { color: var(--accent); font-weight: 600; }
.reasons { list-style: none; margin: 0 0 32px; padding: 0; display: grid; gap: 12px; max-width: 70ch; }
.reasons li { padding: 16px 20px; background: var(--surface); border-radius: 8px; font-size: 1.02rem; }
.work-style { color: var(--muted); font-size: 0.92rem; }
.timeline { display: grid; border-top: 1px solid var(--line); margin-bottom: 32px; }
.job { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 24px; padding: 24px 0; border-bottom: 1px solid var(--line); }
.job .meta { margin: 4px 0 0; }
.job h3 { font-size: 1.2rem; }
.job .org { color: var(--accent); font-weight: 600; font-size: 0.9rem; margin: 4px 0 10px; }
.job ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 0.95rem; display: grid; gap: 6px; }
@media (max-width: 720px) { .job { grid-template-columns: 1fr; gap: 4px; } }
/* Contact */
.contact { display: grid; gap: 12px; }
.contact a { font: 600 1.25rem var(--font-display); }
footer { margin-top: 48px; padding: 36px 0 64px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.82rem; letter-spacing: 0.04em; }

@media (max-width: 720px) {
  .report { grid-template-columns: 1fr; gap: 10px; }
  .nav { display: none; }
  .hero { padding-top: 48px; }
  .stat, .stat + .stat { padding: 20px 0; border-left: 0; border-top: 1px solid var(--line); }
  .stats { border-top: 0; margin-top: 40px; }
  section.block { padding: 52px 0; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>

</div>

  <div class="hero-band">
    <div class="wrap">
      <section class="hero" id="hero"></section>
    </div>
  </div>
  <div class="wrap" id="sections"></div>
</main>

<footer>
  <div class="wrap" id="footer"></div>
</footer>

      <circle cx="${hubPos[i][0].toFixed(1)}" cy="${hubPos[i][1].toFixed(1)}" r="56" fill="var(--accent)" stroke="var(--accent)"></circle>
    </g>
    ${n.lines.map((t, j) => `<text class="vt h2" x="${hubPos[i][0].toFixed(1)}" y="${(hubPos[i][1] + 5 - (n.lines.length - 1) * 8 + j * 16).toFixed(1)}">${esc(t)}</text>`).join("")}`).join("")}
</svg>`;

const hubCards = H.nodes.map((n, i) => `
  <article class="card vcard" data-i="${i}" style="--c:var(--accent)">
    <h3>${esc(n.name)}</h3>
    <p>${esc(n.blurb)}</p>
    ${tags(n.skills)}
  </article>`).join("");

parts.push(section("skills", "Skillset", "The skills behind the work",
  "Six areas I work across. Hover a circle to see what sits behind it.",
  `<div class="venn-layout">
     <div>${hubSvg}</div>
     <div class="vcards">${hubCards}</div>
   </div>
   <p class="venn-note"><b>In practice:</b> ${esc(H.note)}</p>`));

parts.push(section("perspective", "07 Perspective", "What I believe about transformation",
  "One philosophy guides my work, and four principles follow from it.",
  `<blockquote class="pull"><p>${esc(SITE.philosophy.quote)}</p><span>${esc(SITE.philosophy.text)}</span></blockquote>
   <div class="grid cols-2">${SITE.views.map((v) => `
    <article class="card"><h3>${esc(v.title)}</h3><p>${esc(v.text)}</p></article>`).join("")}</div>`));

parts.push(section("contact", "Contact", "Let's talk about what you need",
  "Reach out if any of these sound familiar.",
  `<ul class="reasons">${SITE.contactReasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>
   <div class="contact">
     <a href="mailto:${esc(SITE.email)}">${esc(SITE.email)}</a>
     <a href="tel:+1${esc(SITE.phone.replace(/\D/g, ""))}">${esc(SITE.phone)}</a>
     <a href="${esc(SITE.linkedin)}" rel="noopener">${esc(SITE.linkedin.replace("https://", ""))}</a>
     <p class="work-style">${esc(SITE.workStyle)}</p>
   </div>`));

$("#sections").innerHTML = parts.join("");

$("#navlinks").innerHTML = [
  ["achievements", "Results"], ["help", "How I help"], ["approach", "Approach"], ["problems", "Problems"], ["reports", "Reports"],
  ["projects", "Projects"], ["leadership", "Leadership"], ["experience", "Experience"], ["skills", "Skills"], ["perspective", "Views"], ["contact", "Contact"]
].map(([id, t]) => `<li><a href="#${id}">${t}</a></li>`).join("");

// Highlight a circle and its card together on hover or keyboard focus
const vennEls = (i) => document.querySelectorAll(`.vc[data-i="${i}"], .vcard[data-i="${i}"]`);
document.querySelectorAll(".vc, .vcard").forEach((el) => {
  const i = el.dataset.i;
  const on = () => vennEls(i).forEach((e) => e.classList.add("on"));
  const off = () => vennEls(i).forEach((e) => e.classList.remove("on"));
  el.addEventListener("mouseenter", on);
  el.addEventListener("mouseleave", off);
  el.addEventListener("focus", on);
  el.addEventListener("blur", off);
});

$("#footer").textContent = `© ${new Date().getFullYear()} ${SITE.name}`;
</script>
</body>
</html>
