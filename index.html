/* Layout: navy masthead with the headline numbers, then a restrained white-on-grey body of ruled sections. Serif headings, brass accents. */
:root {

  --ink: #eef1f6;
  --muted: #9ba6b8;
  --line: #263041;
  --navy: #0a1020;
  --accent: #7ca8ff;
  --accent-soft: #1b2740;
  --signal: #9d8cf0;
  --violet: #4fb3bf;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;

}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.65 var(--font-body); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.15; }
p { margin: 0; }
.wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 24px; }
.caps { text-transform: uppercase; letter-spacing: 0.14em; font-weight: 600; font-size: 0.72rem; }

/* Nav */
.nav { position: sticky; top: 0; z-index: 10; background: var(--navy); border-bottom: 1px solid rgba(255,255,255,0.08); }
.nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 60px; }
.brand { font: 600 1.15rem var(--font-display); color: #fff; text-decoration: none; white-space: nowrap; letter-spacing: 0.01em; }
.nav ul { display: flex; gap: 22px; list-style: none; margin: 0; padding: 0; overflow-x: auto; }
.nav li a { display: block; padding: 6px 0; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 500; font-size: 0.72rem; color: #b9c4d9; text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; }
.nav li a:hover { color: #fff; border-bottom-color: #7ca8ff; }

/* Masthead */
.hero-band { background: var(--navy); color: #fff; }
.hero { padding: 80px 0 0; }
.hero-band { border-bottom: 1px solid var(--line); }
.eyebrow { text-transform: uppercase; letter-spacing: 0.16em; font-weight: 600; font-size: 0.75rem; color: #7ca8ff; }

.hero .lede { max-width: 58ch; font-size: 1.2rem; line-height: 1.6; color: #c3cde0; padding-left: 20px; border-left: 3px solid #7ca8ff; }
.hero .focus { margin-top: 16px; padding-left: 23px; text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.75rem; font-weight: 500; color: #8f9cb3; }
.hero .philosophy { margin-top: 28px; font: 500 italic 1.5rem/1.35 var(--font-display); color: #fff; max-width: 34ch; }
.pull { margin: 0 0 28px; padding: 28px 32px; background: var(--surface); border-left: 4px solid var(--accent); }
.pull p { font: 600 clamp(1.5rem, 3vw, 2.1rem)/1.25 var(--font-display); }
.pull span { display: block; margin-top: 12px; color: var(--muted); max-width: 64ch; }
.hero .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
.btn { display: inline-block; padding: 12px 24px; border-radius: 2px; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; border: 1.5px solid #fff; color: #fff; }
.btn.primary { background: #7ca8ff; border-color: #7ca8ff; color: #0a1020; }
.btn:hover { filter: brightness(1.08); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-top: 64px; border-top: 1px solid rgba(255,255,255,0.16); }
.stat { padding: 28px 24px 32px 0; }
.stat + .stat { padding-left: 24px; border-left: 1px solid rgba(255,255,255,0.16); }
.stat b { display: block; font: 600 2.6rem/1 var(--font-display); font-variant-numeric: tabular-nums; color: #fff; }
.stat span { display: block; margin-top: 10px; font-size: 0.88rem; color: #aebad1; max-width: 22ch; }

/* Sections */
section.block { padding: 72px 0; border-top: 1px solid var(--line); }
section.block:first-child { border-top: 0; }
.label { text-transform: uppercase; letter-spacing: 0.16em; font-weight: 600; font-size: 0.72rem; color: var(--accent); }
.block h2 { font-size: clamp(1.8rem, 3.6vw, 2.5rem); margin: 10px 0 12px; letter-spacing: -0.01em; }
.block h2::after { content: ""; display: block; width: 48px; height: 3px; background: var(--accent); margin-top: 16px; }

.meta { text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.7rem; font-weight: 500; color: var(--muted); margin-bottom: 8px; }

.case dt { text-transform: uppercase; letter-spacing: 0.14em; font-weight: 600; font-size: 0.68rem; color: var(--accent); }
.case dd { margin: 3px 0 0; color: var(--muted); font-size: 0.95rem; }
.case dd.result { color: var(--ink); font-weight: 500; }

.report { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 2fr) minmax(0, 1fr); gap: 24px; padding: 22px 26px; border-top: 1px solid var(--line); align-items: start; }

.vt { font-family: var(--font-body); fill: var(--ink); text-anchor: middle; pointer-events: none; }
.vt.h { font-family: var(--font-display); font-weight: 600; font-size: 19px; }
.vt.s { font-size: 12px; fill: var(--muted); }
.vt.o { font-size: 12px; font-weight: 500; }
.vt.c { font-family: var(--font-display); font-weight: 600; font-size: 15px; }

.vcard { border-top: 1px solid var(--line); border-left: 5px solid var(--c); padding: 20px 22px; transition: background 0.2s; }
.vcard.on { background: color-mix(in srgb, var(--c) 10%, var(--surface)); }

.vcard .tag { background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: var(--ink); }

footer { padding: 36px 0 64px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.82rem; letter-spacing: 0.04em; }

  section.block { padding: 52px 0; }

@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

// Highlight a circle and its card together on hover or keyboard focus
const vennEls = (i) => document.querySelectorAll(`.vc[data-i="${i}"], .vcard[data-i="${i}"]`);
document.querySelectorAll(".vc, .vcard").forEach((el) => {
  const i = el.dataset.i;
  const on = () => vennEls(i).forEach((e) => e.classList.add("on"));
  const off = () => vennEls(i).forEach((e) => e.classList.remove("on"));
  el.addEventListener("mouseenter", on);
  el.addEventListener("mouseleave", off);
  el.addEventListener("focus", on);
  el.addEventListener("blur", off);
});
