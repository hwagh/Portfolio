<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hrishikesh Wagh | Manufacturing Transformation Leader</title>
<meta name="description" content="Manufacturing transformation leader connecting Operations, Product, MES, ERP, Data and Technology to deliver measurable plant performance.">
<meta property="og:title" content="Hrishikesh Wagh | Manufacturing Transformation Leader">
<meta property="og:description" content="Connecting Operations, Product, MES, ERP, Data and Technology to deliver measurable plant performance.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--surface:#f6f8fb;--ink:#0f1d3a;--muted:#55627a;--line:#dde3ec;--navy:#0a1020;--accent:#2554b8;--accent-soft:#e6edfa;
--serif:'Source Serif 4',Georgia,serif;--sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:1160px;margin:0 auto;padding:0 32px}
/* header */
.head{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.head .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 24px;padding-top:12px;padding-bottom:12px}
.brand{font-weight:600;font-size:15px;letter-spacing:.01em;color:var(--ink);text-decoration:none}
.nav{display:flex;flex-wrap:wrap;gap:4px 20px;align-items:center}
.nav a{color:var(--muted);text-decoration:none;font-size:14px;padding:6px 0}
.nav a:hover{color:var(--ink)}
.btn{display:inline-block;text-decoration:none;font-weight:500;font-size:15px;padding:13px 24px;border-radius:2px;border:1px solid var(--ink);color:var(--ink);background:#fff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--ink);border-color:var(--ink)}
.btn:hover{background:var(--surface)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff;padding:9px 18px;font-size:14px}
.btn.dark:hover{background:var(--accent);border-color:var(--accent)}
.btn.sm{padding:9px 18px;font-size:14px}
.nav a.btn.sm{color:var(--ink)}
/* hero */
.hero{padding:72px 0 64px}
.hero .wrap{display:flex;flex-wrap:wrap;gap:48px;align-items:center}
.hero-l{flex:1 1 520px;min-width:0}
.hero-r{flex:1 1 320px;min-width:0;background:var(--surface);border:1px solid var(--line);padding:28px}
.eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{margin:14px 0 18px;font-family:var(--serif);font-size:58px;line-height:1.06;font-weight:700;letter-spacing:-.01em}
.lede{margin:0 0 14px;font-size:20px;line-height:1.5;color:var(--muted);max-width:600px}
.quote{margin:22px 0;border-left:3px solid var(--accent);padding:4px 0 4px 18px;font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.4;max-width:540px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.contactline{margin-top:22px;font-size:14px;color:var(--muted)}
.contactline a{color:var(--muted)}
.who{display:flex;align-items:center;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.who img{width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:center 20%;border:1px solid var(--line)}
.who b{display:block;font-family:var(--serif);font-size:20px}
.who span{font-size:14px;color:var(--muted)}
.stat{display:flex;align-items:baseline;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:0;padding-bottom:0}
.stat b{font-family:var(--serif);font-size:34px;line-height:1;color:var(--accent);min-width:118px}
.stat span{font-size:14px;color:var(--muted);line-height:1.4}
/* sections */
section.block{padding:72px 0;border-top:1px solid var(--line);scroll-margin-top:64px}
section.alt{background:var(--surface)}
.label{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
h2{margin:8px 0 10px;font-family:var(--serif);font-size:38px;line-height:1.15;font-weight:600}
.intro{margin:0 0 36px;color:var(--muted);font-size:18px;max-width:720px}
h3{margin:0;font-size:19px;line-height:1.3;font-weight:600}
/* cases */
.case{display:flex;flex-wrap:wrap;gap:28px 44px;background:#fff;border:1px solid var(--line);padding:36px;margin-bottom:24px}
.case-l{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:10px;align-content:start}
.case .tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
.case .big{font-family:var(--serif);font-size:64px;line-height:1;font-weight:700;letter-spacing:-.02em}
.case h3{font-family:var(--serif);font-size:25px;font-weight:600}
.case-r{flex:2 1 420px;min-width:0;display:flex;flex-direction:column;gap:18px}
.k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#6b778c;font-weight:600}
.case-r p{margin:4px 0 0}
.case-r .res{font-weight:600}
.minis{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px}
.mini{flex:1 1 300px;min-width:0;background:#fff;border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:6px}
.mini b{font-family:var(--serif);font-size:30px;line-height:1;color:var(--ink)}
.mini span{font-size:14px;color:var(--muted);line-height:1.45}
.mini em{font-style:normal;font-weight:600;font-size:14px}
.sub{margin:44px 0 0;font-family:var(--serif);font-size:22px;font-weight:600}
/* approach */
.steps{display:flex;flex-wrap:wrap;border-top:2px solid var(--ink)}
.step{flex:1 1 200px;min-width:0;padding:22px 20px 22px 0}
.step svg{display:block;margin-bottom:10px}
.step .n{font-family:var(--serif);font-size:15px;color:var(--accent);font-weight:600}
.step h3{font-size:18px;margin:2px 0 6px}
.step p{margin:0;font-size:14px;color:var(--muted);line-height:1.5}
.step .subl{font-size:13px;font-weight:600;color:var(--accent);margin:-2px 0 6px}
.after{margin-top:8px;display:flex;flex-wrap:wrap;gap:16px;align-items:stretch}
.after .lbl{flex:1 1 100%;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#6b778c;font-weight:600}
.after .box{flex:1 1 280px;min-width:0;background:#fff;border:1px solid var(--line);padding:18px 20px}
.after .box p{margin:4px 0 0;font-size:14px;color:var(--muted)}
.final{margin-top:16px;background:var(--navy);color:#fff;padding:22px 26px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center}
.final h3{font-family:var(--serif);font-size:24px}
.final p{margin:0;color:#cbd5e6;font-size:15px;flex:1 1 320px}
/* help */
.cards{display:flex;flex-wrap:wrap;gap:20px}
.card{flex:1 1 440px;min-width:0;background:#fff;border:1px solid var(--line);padding:26px;display:flex;flex-direction:column;gap:10px}
.card p{margin:0;color:var(--muted);font-size:15px}
.card .when{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--ink)}
.card .when b{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
/* leadership */
.lstats{display:flex;flex-wrap:wrap;gap:0;border-top:2px solid var(--ink);margin-bottom:28px}
.ls{flex:1 1 200px;min-width:0;padding:18px 20px 18px 0}
.ls b{display:block;font-family:var(--serif);font-size:44px;line-height:1;color:var(--accent)}
.ls span{font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;background:var(--accent-soft);color:var(--accent);padding:3px 9px;border-radius:999px}
/* skills */
.skills{display:flex;flex-wrap:wrap;gap:0 40px}
.sk{flex:1 1 440px;min-width:0;padding:16px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 20px}
.sk b{flex:0 0 190px;font-size:15px}
.sk span{flex:1 1 220px;font-size:14px;color:var(--muted)}
/* experience */
.job{border-top:1px solid var(--line);padding:24px 0}
.job:first-of-type{border-top:2px solid var(--ink)}
.jh{display:flex;flex-wrap:wrap;gap:4px 24px;justify-content:space-between;align-items:baseline}
.jh h3{font-family:var(--serif);font-size:22px}
.jh .d{font-size:14px;color:var(--muted)}
.role{color:var(--accent);font-weight:500;font-size:15px;margin:2px 0 10px}
.job ul{margin:0;padding-left:20px;color:var(--ink)}
.job li{margin:5px 0;font-size:15px}
details summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:500;margin-top:8px}
.edu{display:flex;flex-wrap:wrap;gap:20px;margin-top:36px}
.edu div{flex:1 1 300px;min-width:0;border:1px solid var(--line);background:#fff;padding:18px 20px;font-size:15px}
.edu b{display:block}
.edu span{font-size:14px;color:var(--muted)}
/* contact */
.contact{background:var(--navy);color:#fff;padding:72px 0;scroll-margin-top:64px}
.contact .label{color:#9db8ee}
.contact h2{color:#fff}
.contact p{color:#cbd5e6}
.reasons{margin:0 0 28px;padding-left:20px;max-width:760px;color:#dbe4f3}
.reasons li{margin:8px 0}
.contact .row{display:flex;flex-wrap:wrap;gap:12px}
.contact .btn{border-color:#fff;color:#fff;background:transparent}
.contact .btn.primary{background:#fff;color:var(--ink);border-color:#fff}
.contact .btn:hover{background:rgba(255,255,255,.12)}
.contact .btn.primary:hover{background:var(--accent-soft)}
.note{margin-top:20px;font-size:14px;color:#9fb0cf}
footer{padding:24px 0;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
a:focus-visible,summary:focus-visible{outline:3px solid #7fb0ff;outline-offset:2px}
@media (max-width:720px){
 h1{font-size:40px}h2{font-size:30px}.hero{padding:40px 0}.wrap{padding:0 20px}
 .case{padding:24px}.case .big{font-size:48px}section.block{padding:48px 0}.nav a:not(.btn){display:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="head"><div class="wrap">
  <a class="brand" href="#top">Hrishikesh Wagh</a>
  <nav class="nav" aria-label="Sections">
    <a href="#cases">Case studies</a><a href="#approach">Approach</a><a href="#help">How I help</a><a href="#leadership">Leadership</a><a href="#experience">Experience</a>
    <a class="btn sm" href="Hrishikesh_Wagh_Resume.pdf" download>Download resume</a>
    <a class="btn dark" href="#contact">Work with me</a>
  </nav>
</div></header>
<main id="top">
  <div class="hero" id="hero"></div>
  <div id="sections"></div>
</main>
<script src="photo.js"></script>
<script src="data.js"></script>
<script>
/* ------------------ rendering (no need to edit below) ------------------ */
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const tel = "+1" + SITE.phone.replace(/\D/g, "");
const ICONS = {
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  bulb: '<path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
  database: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  change: '<path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/>',
  deploy: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>'
};
const icon = (n) => `<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#2554b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const tags = (a) => `<div class="chips">${a.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>`;
let secN = 0;
const section = (id, label, title, intro, body, cls) => `
  <section class="block ${cls || ""}" id="${id}"><div class="wrap">
    <div class="label">${String(++secN).padStart(2, "0")} · ${esc(label)}</div>
    <h2>${esc(title)}</h2>
    <p class="intro">${esc(intro)}</p>
    ${body}
  </div></section>`;

$("#hero").innerHTML = `<div class="wrap">
  <div class="hero-l">
    <div class="eyebrow">Transformation · Operations · Manufacturing · MES · Data · AI</div>
    <h1>${esc(SITE.title)}</h1>
    <p class="lede">${esc(SITE.tagline)}</p>
    <p class="lede" style="font-size:17px">${esc(SITE.summary)}</p>
    <div class="quote">${esc(SITE.philosophy.quote)}</div>
    <div class="cta">
      <a class="btn primary" href="#contact">Work with me</a>
      <a class="btn" href="#cases">See the case studies</a>
    </div>
    <div class="contactline"><a href="mailto:${esc(SITE.email)}">${esc(SITE.email)}</a> · <a href="tel:${tel}">${esc(SITE.phone)}</a> · <a href="${esc(SITE.linkedin)}" rel="noopener">LinkedIn</a></div>
  </div>
  <aside class="hero-r" aria-label="Headline results">
    <div class="who"><img src="${PHOTO}" alt="Portrait of ${esc(SITE.name)}"><div><b>${esc(SITE.name)}</b><span>8+ years in manufacturing performance</span></div></div>
    ${SITE.headlineStats.map((s) => `<div class="stat"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join("")}
  </aside></div>`;

const parts = [];

/* 01 case studies */
parts.push(section("cases", "Case studies", "Problem. Fix. Result.",
  "Three examples of how I take a plant problem to a number leadership can see.",
  SITE.cases.map((c) => `
  <article class="case">
    <div class="case-l"><div class="tag">${esc(c.tag)}</div><div class="big">${esc(c.big)}</div><h3>${esc(c.title)}</h3></div>
    <div class="case-r">
      <div><div class="k">The problem</div><p>${esc(c.problem)}</p></div>
      <div><div class="k">What I did</div><p>${esc(c.did)}</p></div>
      <div><div class="k">The result</div><p class="res">${esc(c.result)}</p></div>
    </div>
  </article>`).join("") +
  `<div class="sub">More results</div><div class="minis">${SITE.minis.map((m) => `
    <div class="mini"><b>${esc(m.b)}</b><em>${esc(m.t)}</em><span>${esc(m.w)}</span></div>`).join("")}</div>`, "alt"));

/* 02 approach */
const A = SITE.approach;
parts.push(section("approach", "End-to-end approach", "I don't just solve the problem. I make it stick.",
  "The same path every time, from the physical work to a control that holds across sites.",
  `<div class="steps">${A.steps.map((s, i) => `
    <div class="step">${icon(s.icon)}<div class="n">0${i + 1}</div><h3>${esc(s.title)}</h3>${s.sub ? `<div class="subl">${esc(s.sub)}</div>` : ""}<p>${esc(s.text)}</p></div>`).join("")}</div>
  <div class="after"><div class="lbl">${esc(A.afterLabel)}</div>
    ${A.after.map((s) => `<div class="box"><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div>`).join("")}
  </div>
  <div class="final"><h3>${esc(A.final.title)}</h3><p>${esc(A.final.text)}</p></div>`));

/* 03 how I can help */
parts.push(section("help", "How I can help", "Where I can help your organization",
  "Typical engagements, and the situation that usually calls for them.",
  `<div class="cards">${SITE.help.map((h) => `
    <article class="card"><h3>${esc(h.title)}</h3><p>${esc(h.text)}</p><div class="when"><b>You might need this if</b>${esc(h.when)}</div></article>`).join("")}</div>`, "alt"));

/* 04 leadership */
const L = SITE.leadership;
parts.push(section("leadership", "Leadership and coaching", "Teams built, people trained",
  SITE.philosophy.text,
  `<div class="lstats">${L.top.map((t) => `<div class="ls"><b>${esc(t.big)}</b><span>${esc(t.label)}</span></div>`).join("")}</div>
  <div class="cards">${L.cards.map((c) => `<article class="card"><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p>${tags(c.tags)}</article>`).join("")}</div>`));

/* 05 skills */
parts.push(section("skills", "Skillset", "Ten areas, one connected practice",
  "Process, business, systems, data, AI, people and leadership, used together rather than one at a time.",
  `<div class="skills">${SITE.hub.nodes.map((n) => `<div class="sk"><b>${esc(n.name)}</b><span>${esc(n.skills.slice(0, 4).join(" · "))}</span></div>`).join("")}</div>`, "alt"));

/* 06 experience */
const jobHTML = (j) => {
  const first = j.points.slice(0, 3), rest = j.points.slice(3);
  return `<div class="job"><div class="jh"><h3>${esc(j.org)}</h3><span class="d">${esc(j.dates)}</span></div>
    <div class="role">${esc(j.role)}</div>
    <ul>${first.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>
    ${rest.length ? `<details><summary>Show ${rest.length} more</summary><ul>${rest.map((p) => `<li>${esc(p)}</li>`).join("")}</ul></details>` : ""}
  </div>`;
};
parts.push(section("experience", "Experience and education", "Where I have done this work", "Most recent first.",
  SITE.experience.map(jobHTML).join("") +
  `<div class="edu">${SITE.education.map((e) => `<div><b>${esc(e.title)}</b>${esc(e.org)}<br><span>${esc(e.dates)}</span></div>`).join("")}
    ${SITE.certifications.map((c) => `<div><b>${esc(c.title)}</b><span>${esc(c.dates)}</span></div>`).join("")}</div>`));

$("#sections").innerHTML = parts.join("") + `
  <section class="contact" id="contact"><div class="wrap">
    <div class="label">Contact</div>
    <h2>Have a plant, a program or a problem to fix?</h2>
    <ul class="reasons">${SITE.contactReasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>
    <div class="row">
      <a class="btn primary" href="mailto:${esc(SITE.email)}?subject=Opportunity%20or%20project">Email me</a>
      <a class="btn" href="tel:${tel}">${esc(SITE.phone)}</a>
      <a class="btn" href="${esc(SITE.linkedin)}" rel="noopener">LinkedIn</a>
      <a class="btn" href="Hrishikesh_Wagh_Resume.pdf" download>Download resume</a>
    </div>
    <div class="note">${esc(SITE.workStyle)}</div>
  </div></section>
  <footer><div class="wrap">&copy; ${new Date().getFullYear()} ${esc(SITE.name)}</div></footer>`;
</script>
</body>
</html>
